<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

         /* ================= LOGIN SECTION ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #2e0505;
        }



        .login-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #261829, #555577);
            padding: 30px;
        }

        .login-container {
            width: 500px;
            padding: 45px 35px;
            background: rgba(40, 40, 59, 0.95);
            border: 3px solid white;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            color: white;
            text-align: center;
        }

        .login-container h2 {
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .login-container p {
            color: #ddd;
            margin-bottom: 25px;
        }

        .login-container label {
            display: block;
            text-align: left;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        .login-container input {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 25px;
            padding: 0 18px;
            outline: none;
            font-size: 15px;
        }

        .login-container input:focus {
            box-shadow: 0 0 0 3px #00c9a7;
        }

        .submit-btn {
            margin-top: 25px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 25px;
            background: #00c9a7;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #00a98d;
            color: white;
            transform: translateY(-2px);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .social-icons div {
            width: 42px;
            height: 42px;
            background-size: cover;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
        }

        .social-icons div:hover {
            transform: scale(1.15);
        }

        .box1 {
            background-image: url(google.svg);
        }

        .box2 {
            background-image: url(google2.svg);
        }

        .box3 {
            background-image: url(google3.svg);
        }
    </style>
</head>

<body>
    <!-- ================= LOGIN ================= -->

    <section class="login-section">

        <div class="login-container">

            <h2>LOGIN</h2>

            <p>Sign up and get 30 day free trial</p>

            <form action="softwere.html" method="get">

                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>

                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>

                <button class="submit-btn" type="submit">
                    Submit
                </button>

            </form>

            <div class="social-icons">

                <div class="box1"></div>
                <div class="box2"></div>
                <div class="box3"></div>

            </div>

        </div>

    </section>

</body>

</html>
